<style>
/* =========================================================
   PAKIVOX · FOUNDER CONTROL CENTER V3
========================================================= */

.fv3-shell {
  display: grid;
  gap: 14px;
}

.fv3-command {
  position: relative;
  overflow: hidden;
  padding: 19px;
  border: 1px solid rgba(56, 189, 248, 0.20);
  border-radius: 19px;
  background:
    radial-gradient(
      circle at 85% 0%,
      rgba(99, 102, 241, 0.16),
      transparent 34%
    ),
    radial-gradient(
      circle at 15% 0%,
      rgba(34, 211, 238, 0.08),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      rgba(7, 22, 39, 0.99),
      rgba(4, 13, 25, 0.99)
    );
}

.fv3-command-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
}

.fv3-eyebrow {
  color: #22d3ee;
  font-size: 8px;
  font-weight: 950;
  letter-spacing: 0.16em;
}

.fv3-command h2 {
  margin: 5px 0 3px;
  color: #f8fafc;
  font-size: 20px;
  font-weight: 950;
}

.fv3-command p {
  margin: 0;
  color: #6f87a3;
  font-size: 9.5px;
}

.fv3-platform-state {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 11px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 950;
}

.fv3-platform-state.good {
  color: #bbf7d0;
  border: 1px solid rgba(34, 197, 94, 0.25);
  background: rgba(34, 197, 94, 0.08);
}

.fv3-platform-state.warn {
  color: #fde68a;
  border: 1px solid rgba(245, 158, 11, 0.25);
  background: rgba(245, 158, 11, 0.08);
}

.fv3-platform-state.bad {
  color: #fecaca;
  border: 1px solid rgba(239, 68, 68, 0.27);
  background: rgba(239, 68, 68, 0.08);
}

.fv3-state-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 10px currentColor;
}

.fv3-kpi-strip {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 8px;
  margin-top: 17px;
}

.fv3-mini-kpi {
  min-width: 0;
  padding: 10px;
  border: 1px solid rgba(148, 163, 184, 0.10);
  border-radius: 11px;
  background: rgba(2, 8, 23, 0.34);
}

.fv3-mini-kpi span {
  display: block;
  overflow: hidden;
  color: #637b97;
  font-size: 7.5px;
  font-weight: 850;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fv3-mini-kpi strong {
  display: block;
  margin-top: 4px;
  overflow: hidden;
  color: #e8f0fa;
  font-size: 12px;
  font-weight: 950;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.fv3-mini-kpi.good strong {
  color: #86efac;
}

.fv3-mini-kpi.warn strong {
  color: #fde68a;
}

.fv3-mini-kpi.bad strong {
  color: #fca5a5;
}

.fv3-section {
  display: grid;
  gap: 11px;
  margin-top: 4px;
}

.fv3-section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 14px;
}

.fv3-section-head h2 {
  margin: 0;
  color: #f8fafc;
  font-size: 15px;
  font-weight: 950;
}

.fv3-section-head p {
  margin: 3px 0 0;
  color: #64748b;
  font-size: 9px;
}

.fv3-badge {
  display: inline-flex;
  padding: 5px 8px;
  border-radius: 999px;
  color: #94a3b8;
  border: 1px solid rgba(148, 163, 184, 0.13);
  background: rgba(15, 23, 42, 0.7);
  font-size: 7.5px;
  font-weight: 950;
}

.fv3-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.fv3-stat {
  min-width: 0;
  padding: 13px;
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 13px;
  background: rgba(10, 24, 42, 0.80);
}

.fv3-stat.good {
  border-color: rgba(34, 197, 94, 0.20);
}

.fv3-stat.warn {
  border-color: rgba(245, 158, 11, 0.27);
}

.fv3-stat.bad {
  border-color: rgba(239, 68, 68, 0.28);
}

.fv3-stat span {
  color: #6c829d;
  font-size: 7.5px;
  font-weight: 950;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.fv3-stat strong {
  display: block;
  margin-top: 6px;
  color: #f1f5f9;
  font-size: 20px;
  font-weight: 950;
}

.fv3-stat small {
  display: block;
  margin-top: 5px;
  color: #6d839e;
  font-size: 8px;
  line-height: 1.45;
}

.fv3-matrix {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
}

.fv3-service {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 11px;
  border: 1px solid rgba(148, 163, 184, 0.11);
  border-radius: 12px;
  background: rgba(7, 18, 33, 0.76);
}

.fv3-service-icon {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 9px;
  color: #38bdf8;
  background: rgba(56, 189, 248, 0.07);
}

.fv3-service small {
  display: block;
  color: #64748b;
  font-size: 7.5px;
}

.fv3-service strong {
  display: block;
  margin-top: 2px;
  color: #dbe7f5;
  font-size: 9px;
}

.fv3-light {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.fv3-light.good {
  background: #22c55e;
  box-shadow: 0 0 9px rgba(34, 197, 94, 0.65);
}

.fv3-light.warn {
  background: #f59e0b;
  box-shadow: 0 0 9px rgba(245, 158, 11, 0.55);
}

.fv3-light.bad {
  background: #ef4444;
  box-shadow: 0 0 9px rgba(239, 68, 68, 0.60);
}

.fv3-light.unknown {
  background: #64748b;
}

.fv3-note {
  margin-top: 9px;
  padding: 9px 11px;
  border: 1px dashed rgba(148, 163, 184, 0.13);
  border-radius: 10px;
  color: #64748b;
  font-size: 8px;
  line-height: 1.5;
}

@media (max-width: 1400px) {
  .fv3-kpi-strip {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .fv3-matrix {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 900px) {
  .fv3-grid-4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .fv3-command-top {
    align-items: flex-start;
    flex-direction: column;
  }
}

@media (max-width: 620px) {
  .fv3-kpi-strip,
  .fv3-grid-4,
  .fv3-matrix {
    grid-template-columns: 1fr;
  }
}
</style>
