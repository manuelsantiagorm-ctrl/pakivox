{% extends "base.html" %}
{% block content %}{% include "warehouse/transfers/_styles.html" %}
<main class="wt"><section class="wt-head"><h1>Nuevo traspaso</h1><div>Origen activo: {{ origin.name }}</div></section>
<form method="post">{% csrf_token %}<input type="hidden" name="request_id" value="{{ request_id }}">
<section class="wt-card wt-grid"><div><label>Bodega destino</label><select name="destination_warehouse" required><option value="">Selecciona</option>{% for w in destinations %}<option value="{{ w.pk }}">{{ w.name }}</option>{% endfor %}</select></div><div><label>Prioridad</label><select name="priority">{% for value,label in priority_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div><label>Motivo</label><input name="reason" maxlength="250" required></div><div><label>Observaciones</label><textarea name="notes" rows="2"></textarea></div></section>
<section class="wt-card"><h3>Productos</h3><div class="wt-table"><table id="items"><thead><tr><th>SKU</th><th>Cantidad</th><th>Nota</th></tr></thead><tbody><tr><td><select name="variant_id" required><option value="">Selecciona</option>{% for v in variants %}<option value="{{ v.pk }}">{{ v.sku }} · {{ v.product }}</option>{% endfor %}</select></td><td><input class="wt-number" type="number" name="quantity" min="1" required></td><td><input name="item_notes"></td></tr></tbody></table></div><div class="wt-actions" style="margin-top:14px"><button type="button" class="wt-btn alt" onclick="addRow()">Agregar producto</button><button class="wt-btn ok">Crear borrador</button><a class="wt-btn alt" href="{% url 'warehouse:transfer_list' %}">Cancelar</a></div></section></form></main>
<script>function addRow(){const b=document.querySelector("#items tbody"),r=b.rows[0].cloneNode(true);r.querySelectorAll("input,select").forEach(e=>e.value="");b.appendChild(r)}</script>
{% endblock %}
